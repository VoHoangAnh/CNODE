[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cnode-pd"
version = "0.1.0"
description = "Unofficial re-implementation of CNODE: Conditional Neural ODE for longitudinal Parkinson's disease progression forecasting (IEEE BIBM 2025)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "torchdiffeq>=0.2.3", "numpy>=1.24", "pandas>=2.0",
                "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
vertex = ["nibabel>=5.0"]
dev = ["pytest>=7"]

[project.scripts]
cnode = "cnode.cli:main"

[tool.setuptools.packages.find]
include = ["cnode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
